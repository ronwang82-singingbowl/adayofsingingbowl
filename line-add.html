<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加入缽日官方 LINE</title>
<link rel="icon" type="image/png" href="favicon.png?v=30">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #F8F5EE; --ink-2: #FFFFFF; --ink-3: #F1EDE4;
    --brass: #73846B; --brass-soft: #E4C778; --brass-dim: #8A6A49;
    --paper: #4E5E48; --mist: #5F6F5A; --hairline: #D8D4CC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; background: var(--ink); color: var(--paper);
    font-family: "Noto Sans TC", sans-serif; font-weight: 300;
    display: flex; align-items: center; justify-content: center; padding: 32px 20px;
  }
  .card {
    max-width: 380px; width: 100%; background: var(--ink-3); border: 1px solid var(--hairline);
    border-radius: 20px; padding: 36px 28px 32px; text-align: center;
  }
  .brand {
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px;
  }
  .brand img { width: 36px; height: 36px; border-radius: 50%; }
  .brand span {
    font-family: "Noto Serif TC", serif; font-weight: 600; font-size: 19px; color: var(--paper);
    letter-spacing: 0.04em;
  }
  h1 {
    font-family: "Noto Serif TC", serif; font-weight: 600; font-size: 20px; line-height: 1.5;
    margin: 0 0 10px; color: var(--paper);
  }
  p.sub {
    font-size: 13.5px; color: var(--mist); line-height: 1.8; margin: 0 0 22px;
  }
  .qr-wrap {
    width: 190px; height: 190px; margin: 0 auto 18px; background: var(--paper);
    border-radius: 14px; padding: 12px; display: flex; align-items: center; justify-content: center;
  }
  .qr-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .qr-caption {
    font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--mist); margin-bottom: 24px;
  }
  .cta-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px 20px; background: var(--brass); color: var(--ink);
    font-weight: 600; font-size: 15px; text-decoration: none; border-radius: 999px;
  }
  .foot {
    margin-top: 18px; font-size: 11.5px; color: var(--mist);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="favicon.png?v=30" alt="缽日">
      <span>缽日</span>
    </div>
    <h1>正在為您開啟 LINE...</h1>
    <p class="sub">若您的電腦已安裝 LINE 桌面版，稍後會跳出視窗詢問是否開啟。<br>若沒有反應，請直接用手機掃描下方 QR code 加入好友。</p>
    <div class="qr-wrap">
      <img id="qrImg" src="" alt="缽日官方 LINE QR code">
    </div>
    <div class="qr-caption">掃描加入，或用手機點擊下方按鈕</div>
    <a class="cta-btn" href="https://lin.ee/5FUzEjg" target="_blank" rel="noopener">加入 LINE 好友</a>
    <div class="foot">缽日｜用聲音陪你梳理找回內在平衡</div>
  </div>
