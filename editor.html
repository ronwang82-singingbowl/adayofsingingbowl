<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缽日網站編輯器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ EDITOR CHROME (tool UI, light) ============ */
:root{
  --ui-bg:#F5F3EE; --ui-panel:#FFFFFF; --ui-line:#E4DFD3; --ui-text:#2A2620;
  --ui-mute:#8A8478; --ui-accent:#B4823F; --ui-accent-soft:#EFDCB8;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; font-family:"Noto Sans TC",sans-serif; background:var(--ui-bg); color:var(--ui-text); }
.app{ display:flex; height:100vh; }
.panel{
  width: 440px; flex-shrink:0; background:var(--ui-panel); border-right:1px solid var(--ui-line);
  overflow-y:auto; padding: 22px 22px 60px;
}
.preview-pane{ flex:1; overflow-y:auto; background:#0d0f13; }
.preview-pane .stage{ transform-origin: top center; }

.topbar{
  position:sticky; top:-22px; background:var(--ui-panel); margin:-22px -22px 18px; padding:18px 22px 14px;
  border-bottom:1px solid var(--ui-line); z-index:5;
}
.topbar h1{ font-size:16px; margin:0 0 4px; }
.topbar p{ font-size:12px; color:var(--ui-mute); margin:0 0 12px; line-height:1.6; }
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
button.tool{
  font-family:"Noto Sans TC",sans-serif; font-size:12.5px; font-weight:600; cursor:pointer;
  border:1px solid var(--ui-line); background:#fff; color:var(--ui-text); border-radius:8px; padding:9px 12px;
}
button.tool.primary{ background:var(--ui-accent); border-color:var(--ui-accent); color:#fff; }
button.tool:hover{ filter:brightness(0.97); }
input[type=file]{ display:none; }

details.sec{ border:1px solid var(--ui-line); border-radius:10px; margin-bottom:12px; background:#fff; }
details.sec > summary{
  cursor:pointer; padding:13px 14px; font-size:13.5px; font-weight:600; list-style:none;
  display:flex; align-items:center; justify-content:space-between;
}
details.sec > summary::-webkit-details-marker{ display:none; }
details.sec > summary::after{ content:"▸"; color:var(--ui-mute); transition: transform .15s; }
details.sec[open] > summary::after{ transform: rotate(90deg); }
.sec-body{ padding: 4px 14px 16px; }

label.f{ display:block; font-size:11.5px; color:var(--ui-mute); margin:10px 0 4px; }
input.f, textarea.f{
  width:100%; font-family:"Noto Sans TC",sans-serif; font-size:13px; padding:8px 10px;
  border:1px solid var(--ui-line); border-radius:7px; background:#FBFAF7; color:var(--ui-text); resize:vertical;
}
textarea.f{ min-height:56px; line-height:1.6; }
input.f:focus, textarea.f:focus{ outline:2px solid var(--ui-accent-soft); border-color:var(--ui-accent); }

.item-block{ border:1px dashed var(--ui-line); border-radius:8px; padding:10px 10px 12px; margin-top:12px; position:relative; }
.item-block .rm{
  position:absolute; top:8px; right:8px; font-size:11px; color:#B14545; background:none; border:none; cursor:pointer;
}
.add-btn{
  margin-top:12px; width:100%; padding:9px; border:1px dashed var(--ui-accent); color:var(--ui-accent);
  background:#FCF7EE; border-radius:8px; cursor:pointer; font-size:12.5px; font-weight:600;
}
.img-row{ display:flex; align-items:center; gap:10px; margin-top:6px; }
.img-row img.thumb{ width:44px; height:44px; object-fit:cover; border-radius:6px; border:1px solid var(--ui-line); background:#eee; }
.img-row button.tool{ padding:7px 10px; font-size:11.5px; }

.imgtype-toggle{ display:flex; gap:6px; margin-top:8px; }
.imgtype-toggle button{
  flex:1; font-size:11px; padding:6px; border:1px solid var(--ui-line); background:#fff; border-radius:6px; cursor:pointer;
}
.imgtype-toggle button.active{ background:var(--ui-accent); color:#fff; border-color:var(--ui-accent); }

/* ============ Drag and Drop Styles ============ */
.drag-handle {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--ui-accent);
  background: var(--ui-accent-soft);
  border-radius: 4px;
  padding: 3px 8px;
  margin-bottom: 8px;
  cursor: grab;
  user-select: none;
}
.drag-handle:active {
  cursor: grabbing;
}
.item-block.dragging {
  opacity: 0.5;
  border: 1px dashed var(--ui-accent);
  background: #FFFBF5;
}

.howto{ font-size:12px; color:var(--ui-mute); line-height:1.9; background:#FBF8F1; border:1px solid var(--ui-line); border-radius:8px; padding:12px 14px; margin-bottom:16px; }
.howto b{ color:var(--ui-text); }
.howto ol{ margin:6px 0 0; padding-left:18px; }

/* ============ SITE PREVIEW STYLES (copied from live site) ============ */
.stage{
  --ink: #F8F5EE; --ink-2: #FFFFFF; --ink-3: #F1EDE4;
  --brass: #73846B; --brass-soft: #E4C778; --brass-dim: #8A6A49;
  --jade: #DCC6A4; --paper: #4E5E48; --mist: #5F6F5A; --hairline: #D8D4CC;
  --maxw: 760px;
  background: var(--ink); color: var(--paper);
  font-family: "Noto Sans TC", sans-serif; font-weight:300; line-height:1.9;
}
.stage .wrap{ max-width: var(--maxw); margin:0 auto; padding:0 28px; }
.stage a{ color:inherit; }
.stage .eyebrow{
  font-family:"JetBrains Mono", monospace; font-size:12px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--brass); display:inline-flex; align-items:center; gap:10px; margin-bottom:22px;
}
.stage .eyebrow::before{ content:""; width:18px; height:1px; background:var(--brass-dim); }
.stage h1,.stage h2,.stage h3{ font-family:"Noto Serif TC", serif; font-weight:600; margin:0; color:var(--paper); }
.stage .hero{ position:relative; min-height:92vh; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:100px 28px 70px; text-align:center; }
.stage .hero-inner{ position: relative; z-index: 1; }
.stage .ripple-field{ position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 0; pointer-events: none; }
.stage .ripple-field svg{ width: min(900px, 140vw); height: min(900px, 140vw); }
.stage .ripple-ring{ fill: none; stroke: var(--brass-dim); stroke-width: 1; opacity: 0; transform-origin: center; animation: ripple 7s cubic-bezier(.2,.6,.35,1) infinite; }
.stage .ripple-ring.r2{ animation-delay: 1.75s; }
.stage .ripple-ring.r3{ animation-delay: 3.5s; }
.stage .ripple-ring.r4{ animation-delay: 5.25s; }
@keyframes ripple {
  0% {
    r: 20px;
    opacity: 0;
    stroke-width: 2.4;
  }
  8% {
    opacity: 0.55;
  }
  100% {
    r: 420px;
    opacity: 0;
    stroke-width: 0.4;
  }
}
.stage .hero h1{ font-size:clamp(44px,10vw,80px); letter-spacing:.04em; line-height:1.1; }
.stage .hero-sub{ font-family:"Noto Serif TC",serif; font-size:clamp(16px,3vw,20px); color:var(--brass-soft); margin-top:16px; }
.stage .hero-desc{ max-width:460px; margin:22px auto 0; color:var(--mist); font-size:15px; }
.stage .hero-reassure{ margin-top:14px; font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--mist); }
.stage .cta-btn{
  display:inline-flex; align-items:center; gap:10px; margin-top:36px; padding:15px 30px; background:var(--brass);
  color:var(--ink); font-weight:600; font-size:15px; text-decoration:none; border-radius:999px;
}
.stage section{ padding:80px 0; }
.stage section.tight{ padding:64px 0; }
.stage .lede{ font-family:"Noto Serif TC",serif; font-size:clamp(20px,3.2vw,27px); line-height:1.65; max-width:600px; }
.stage .lede .accent{ color:var(--brass); }
.stage .body-text{ color:var(--mist); font-size:15.5px; max-width:560px; margin-top:18px; }
.stage .diff-grid{ margin-top:36px; display:grid; grid-template-columns:1fr 1fr; gap:24px; }
.stage .diff-item{ border-top:1px solid var(--brass-dim); padding-top:16px; }
.stage .diff-item .not{ font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--mist); text-decoration:line-through; text-decoration-color:var(--brass-dim); }
.stage .diff-item .is{ font-family:"Noto Serif TC",serif; font-size:16px; margin-top:8px; line-height:1.7; }
.stage .card-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--hairline); margin-top:40px; border:1px solid var(--hairline); }
.stage .card{ background:var(--ink); padding:32px 26px; }
.stage .card .tag{ font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--jade); text-transform:uppercase; }
.stage .card h3{ font-size:20px; margin-top:12px; }
.stage .card p{ color:var(--mist); font-size:14px; margin-top:12px; line-height:1.8; }
.stage .testi-grid{ margin-top:40px; display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
.stage .testi-photo{ grid-row:span 2; border-radius:14px; overflow:hidden; border:1px solid var(--hairline); background:var(--ink-2); }
.stage .testi-photo img{ width:100%; display:block; }
.stage .testi-photo .cap{ padding:12px 14px 14px; font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--mist); }
.stage .testi-card{ background:var(--ink-2); border:1px solid var(--hairline); border-radius:14px; padding:22px 20px; }
.stage .testi-card .qm{ font-family:"Noto Serif TC",serif; color:var(--brass-dim); font-size:26px; line-height:1; }
.stage .testi-card p{ font-family:"Noto Serif TC",serif; font-size:14.5px; line-height:1.85; margin:6px 0 0; }
.stage .testi-card .by{ margin-top:12px; font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--jade); }
.stage .who-list{ margin-top:36px; border-top:1px solid var(--hairline); }
.stage .who-item{ display:flex; gap:16px; padding:18px 0; border-bottom:1px solid var(--hairline); align-items:baseline; }
.stage .who-item .mark{ font-family:"JetBrains Mono",monospace; color:var(--brass-dim); font-size:12px; }
.stage .who-item p{ margin:0; font-size:15.5px; }
.stage .process{ margin-top:40px; }
.stage .step{ display:grid; grid-template-columns:56px 1fr; gap:20px; padding:24px 0; border-top:1px solid var(--hairline); }
.stage .step:last-child{ border-bottom:1px solid var(--hairline); }
.stage .step .num{ font-family:"Noto Serif TC",serif; font-size:26px; color:var(--brass-dim); }
.stage .step h3{ font-size:16.5px; font-family:"Noto Sans TC",sans-serif; font-weight:600; }
.stage .step p{ margin:8px 0 0; color:var(--mist); font-size:14px; }
.stage .about-grid{ margin-top:40px; display:flex; gap:22px; align-items:flex-start; }
.stage .about-badge{ flex-shrink:0; width:64px; height:64px; border-radius:50%; background:var(--ink-2); border:1px solid var(--brass-dim); display:flex; align-items:center; justify-content:center; font-family:"Noto Serif TC",serif; font-size:22px; color:var(--brass-soft); }
.stage .about-name{ font-size:19px; }
.stage .about-role{ font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--jade); margin-top:6px; }
.stage .about-bio{ color:var(--mist); font-size:14.5px; margin-top:12px; line-height:1.85; }
.stage .about-meta{ margin-top:12px; font-size:12.5px; color:var(--mist); }
.stage .quote-section{ text-align:center; padding:100px 0; }
.stage .quote-mark{ font-family:"Noto Serif TC",serif; font-size:56px; color:var(--brass-dim); line-height:1; }
.stage blockquote{ margin:8px auto 0; max-width:540px; font-family:"Noto Serif TC",serif; font-size:clamp(18px,3vw,25px); line-height:1.7; }
.stage .quote-by{ margin-top:20px; font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--jade); text-transform:uppercase; }
.stage .faq-item{ border-top:1px solid var(--hairline); padding:20px 0; }
.stage .faq-item:last-child{ border-bottom:1px solid var(--hairline); }
.stage .faq-q{ font-size:15.5px; font-weight:500; display:flex; justify-content:space-between; }
.stage .faq-a{ color:var(--mist); font-size:14px; margin-top:10px; line-height:1.8; }
.stage .final{ text-align:center; background:transparent; border-top:1px solid var(--hairline); padding:100px 0 80px; }
.stage .final h2{ font-size:clamp(26px,5vw,38px); line-height:1.4; white-space:pre-line; }
.stage .line-card{ margin:40px auto 0; max-width:360px; background:var(--ink-3); border:1px solid var(--hairline); border-radius:18px; padding:32px 26px 28px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.stage .line-name{ font-family:"Noto Serif TC",serif; font-size:16px; color:var(--brass-soft); line-height:1.6; }
.stage .line-id{ font-family:"JetBrains Mono",monospace; font-size:12.5px; color:var(--mist); margin-top:6px; }
.stage .qr-wrap{ margin:22px auto 0; width:156px; height:156px; background:var(--paper); border-radius:12px; padding:10px; display:flex; align-items:center; justify-content:center; }
.stage .qr-wrap img{ width:100%; height:100%; object-fit:contain; }
.stage .qr-caption{ font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--mist); margin-top:12px; }
.stage footer{ text-align:center; padding:34px 28px 44px; color:var(--mist); font-size:12px; }
.stage .foot-links{ margin-bottom:12px; display:flex; gap:16px; justify-content:center; font-size:12.5px; }

/* Global box-sizing inside preview pane */
.stage, .stage *, .stage *::before, .stage *::after { box-sizing: border-box; }
</style>
</head>

<div id="editorGateLock" style="position:fixed; inset:0; background:#F5F3EE; z-index:99999; display:flex; align-items:center; justify-content:center; font-family:'Noto Sans TC',sans-serif; color:#8A8478; text-align:center; padding:20px;">
  <div>驗證中...</div>
</div>

<div class="app" id="mainAppRoot" style="display:none;">
  <div class="panel" id="panel"></div>
  <div class="preview-pane"><div class="stage" id="stage"></div></div>
</div>

<script>
(function editorAccessGate(){
  // 這個工具能直接發布內容到正式網站，加一道密碼門檻避免被公開網址誤觸或亂試。
  const STORED_HASH = "7abcbcc0236eb18def7ee9c357f08b291f1db739ea526a956eb308df581ead40";
  async function sha256Hex(str){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }
  async function run(){
    const lockEl = document.getElementById("editorGateLock");
    const appEl = document.getElementById("mainAppRoot");
    if (sessionStorage.getItem("bori_editor_ok") === "1") {
      lockEl.remove();
      appEl.style.display = "";
      return;
    }
    for (let i = 0; i < 3; i++) {
      const pw = prompt("此頁面為缽日網站編輯器，請輸入密碼：");
      if (pw === null) break;
      const hash = await sha256Hex(pw);
      if (hash === STORED_HASH) {
        sessionStorage.setItem("bori_editor_ok", "1");
        lockEl.remove();
        appEl.style.display = "";
        return;
      }
      alert("密碼不正確。");
    }
    lockEl.innerHTML = '<div>🔒 驗證失敗，請重新整理頁面再試一次。</div>';
  }
  run();
})();
</script>

/* ================= HELPERS ================= */
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }

function fileToBase64(file, cb){
  const reader = new FileReader();
  reader.onload = () => cb(reader.result);
  reader.readAsDataURL(file);
}

/* ================= FORM BUILDERS ================= */
const panel = document.getElementById("panel");

function el(html){ const d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild; }

function fieldInput(label, value, onChange, multiline){
  const wrap = document.createElement("div");
  const l = document.createElement("label"); l.className="f"; l.textContent=label;
  const inp = document.createElement(multiline?"textarea":"input");
  inp.className="f"; inp.value = value;
  inp.oninput = ()=>{ onChange(inp.value); renderPreview(); };
  wrap.appendChild(l); wrap.appendChild(inp);
  return wrap;
}

function imageField(label, item, srcKey, onUpdate){
  const wrap = document.createElement("div");
  const l = document.createElement("label"); l.className="f"; l.textContent=label;
  const row = document.createElement("div"); row.className="img-row";
  const thumb = document.createElement("img"); thumb.className="thumb";
  function setThumb(src){
    if(src){ thumb.src = src; thumb.style.opacity = 1; }
    else { thumb.removeAttribute("src"); thumb.style.opacity = 0.25; }
  }
  setThumb(item[srcKey]);
  const urlInp = document.createElement("input"); urlInp.className="f"; urlInp.placeholder="貼上圖片網址，或點右邊上傳";
  urlInp.value = item[srcKey] && !item[srcKey].startsWith("data:") ? item[srcKey] : "";
  urlInp.oninput = ()=>{ item[srcKey] = urlInp.value; setThumb(urlInp.value); onUpdate(); renderPreview(); };
  const upBtn = document.createElement("button"); upBtn.className="tool"; upBtn.type="button"; upBtn.textContent="上傳";
  const fileInp = document.createElement("input"); fileInp.type="file"; fileInp.accept="image/*";
  fileInp.onchange = ()=>{
    if(fileInp.files[0]){
      fileToBase64(fileInp.files[0], (b64)=>{
        item[srcKey]=b64; setThumb(b64); urlInp.value=""; onUpdate(); renderPreview();
      });
    }
  };
  upBtn.onclick = ()=> fileInp.click();
  row.appendChild(thumb); row.appendChild(urlInp); row.appendChild(upBtn); row.appendChild(fileInp);
  wrap.appendChild(l); wrap.appendChild(row);
  return wrap;
}

function buildSection(title, bodyBuilder){
  const d = document.createElement("details"); d.className="sec";
  const s = document.createElement("summary"); s.textContent = title;
  const b = document.createElement("div"); b.className="sec-body";
  bodyBuilder(b);
  d.appendChild(s); d.appendChild(b);
  return d;
}

function buildRepeatSection(title, arr, itemBuilder, newItemFactory, addLabel){
  return buildSection(title, (body)=>{
    const list = document.createElement("div");
    let draggedIdx = null;

    function rebuild(){
      list.innerHTML="";
      arr.forEach((item, idx)=>{
        const block = document.createElement("div");
        block.className="item-block";
        block.setAttribute("draggable", "true");

        // Drag Handle
        const handle = document.createElement("div");
        handle.className = "drag-handle";
        handle.innerHTML = "⋮⋮ 拖曳排序";
        block.appendChild(handle);

        const rm = document.createElement("button");
        rm.className="rm";
        rm.textContent="移除 ✕";
        rm.onclick = (e)=>{
          e.stopPropagation();
          arr.splice(idx,1);
          rebuild();
          renderPreview();
        };
        block.appendChild(rm);

        itemBuilder(block, item, idx, rebuild);

        // Drag & Drop event listeners
        block.ondragstart = (e) => {
          draggedIdx = idx;
          block.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
        };
        block.ondragend = () => {
          block.classList.remove("dragging");
          draggedIdx = null;
        };
        block.ondragover = (e) => {
          e.preventDefault();
          return false;
        };
        block.ondrop = (e) => {
          e.preventDefault();
          if (draggedIdx !== null && draggedIdx !== idx) {
            const temp = arr[draggedIdx];
            arr.splice(draggedIdx, 1);
            arr.splice(idx, 0, temp);
            rebuild();
            renderPreview();
          }
        };

        list.appendChild(block);
      });
    }
    rebuild();
    body.appendChild(list);
    const addBtn = document.createElement("button");
    addBtn.className="add-btn";
    addBtn.type="button";

      arr.push(newItemFactory());
      rebuild();
      renderPreview();
    };
    body.appendChild(addBtn);
  });
}

function stageOnlyCSS(){
  // Pull just the ".stage ..." rules from the page's stylesheet for a clean export
  let out = "";
  for(const sheet of document.styleSheets){
    try{
      for(const rule of sheet.cssRules){
        if(rule.selectorText && rule.selectorText.includes(".stage")){
          out += rule.cssText + "\n";
        }
      }
    }catch(e){}
  }
  return out;
}

function download(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

  try {
    // 1. Get the current file SHA
    const getUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
    const getRes = await fetch(getUrl, {
      headers: {
        "Authorization": `token ${token}`,
        "Accept": "application/vnd.github+json"
      }
    });

    if (!getRes.ok) {
      const errData = await getRes.json();
      throw new Error(`無法獲取原檔案資訊: ${errData.message || getRes.statusText}`);
    }

    const fileData = await getRes.json();
    const sha = fileData.sha;

    // 2. Generate new HTML content
    const newHTML = buildFullSiteHTML();

    // 3. Base64 encode the content (handling UTF-8)
    const base64Content = btoa(unescape(encodeURIComponent(newHTML)));

    // 4. Update file via PUT
    const putUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const putRes = await fetch(putUrl, {
      method: "PUT",
      headers: {
        "Authorization": `token ${token}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: "Update index.html via web editor",
        content: base64Content,
        sha: sha,
        branch: branch
      })
    });

    if (!putRes.ok) {
      const errData = await putRes.json();
      throw new Error(`上傳檔案失敗: ${errData.message || putRes.statusText}`);
    }

    alert("✅ 發布成功！\nGitHub Pages 大約需要 1 分鐘進行部署，請稍候重新整理網頁查看最新內容。");
  } catch (error) {
    alert(`❌ 發布失敗！\n錯誤原因：${error.message}\n請確認您的 Token 是否正確，且擁有 "repo" 權限。`);
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
    btn.style.opacity = "1";
  }
}

function exportSite(){
  const html = buildFullSiteHTML();
  download("index.html", html, "text/html");
}
function saveDraft(){
  download("bowlday-draft.json", JSON.stringify(state, null, 2), "application/json");
}
function loadDraftFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      state = JSON.parse(reader.result);
      buildForm();
      renderPreview();
    }catch(err){ alert("這個檔案打不開，請確認是之前下載的草稿 JSON 檔"); }
  };
  reader.readAsText(file);
}

function parseStateFromHTML(htmlText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlText, "text/html");
  if (!doc) return;

  const getCleanText = (selector) => doc.querySelector(selector)?.textContent?.trim() || "";
  const getCleanAttr = (selector, attr) => doc.querySelector(selector)?.getAttribute(attr)?.trim() || "";

  // 1. Page Title
  state.pageTitle = doc.title || state.pageTitle;

  // 2. Hero
  state.hero.eyebrow = getCleanText(".hero .eyebrow") || state.hero.eyebrow;
  state.hero.title = getCleanText(".hero h1") || state.hero.title;
  state.hero.subtitle = getCleanText(".hero .hero-sub") || state.hero.subtitle;
  state.hero.desc = getCleanText(".hero .hero-desc") || state.hero.desc;
  state.hero.ctaText = getCleanText(".hero .cta-btn") || state.hero.ctaText;
  state.hero.ctaUrl = getCleanAttr(".hero .cta-btn", "href") || state.hero.ctaUrl;
  state.hero.reassure = getCleanText(".hero .hero-reassure") || state.hero.reassure;

  // 3. Diff
  const diffSec = doc.querySelector("section.tight:nth-of-type(1)");
  if (diffSec) {
    state.diff.eyebrow = diffSec.querySelector(".eyebrow")?.textContent?.trim() || state.diff.eyebrow;
    state.diff.lede = diffSec.querySelector(".lede")?.textContent?.trim() || state.diff.lede;
    const diffItems = Array.from(diffSec.querySelectorAll(".diff-item"));
    if (diffItems.length > 0) {
      state.diff.items = diffItems.map(item => ({
        not: item.querySelector(".not")?.textContent?.trim() || "",
        is: item.querySelector(".is")?.textContent?.trim() || ""
      }));
    }
  }

  // 4. Empathy
  const empathySec = Array.from(doc.querySelectorAll(".stage > section")).find(sec => sec.querySelector(".body-text") && !sec.querySelector(".card-grid") && !sec.querySelector(".line-card"));
  if (empathySec) {
    state.empathy.eyebrow = empathySec.querySelector(".eyebrow")?.textContent?.trim() || state.empathy.eyebrow;
    state.empathy.lede = empathySec.querySelector(".lede")?.textContent?.trim() || state.empathy.lede;
    state.empathy.body = empathySec.querySelector(".body-text")?.textContent?.trim() || state.empathy.body;
  }

  // 5. Cards
  const cardsSec = doc.querySelector(".card-grid")?.closest("section");
  if (cardsSec) {
    state.cardsEyebrow = cardsSec.querySelector(".eyebrow")?.textContent?.trim() || state.cardsEyebrow;
    state.cardsTitle = cardsSec.querySelector("h2")?.textContent?.trim() || state.cardsTitle;
    const cards = Array.from(cardsSec.querySelectorAll(".card"));
    if (cards.length > 0) {
      state.cards = cards.map(c => ({
        tag: c.querySelector(".tag")?.textContent?.trim() || "",
        title: c.querySelector("h3")?.textContent?.trim() || "",
        body: c.querySelector("p")?.textContent?.trim() || ""
      }));
    }
  }

  // 6. Testimonials
  const testiSec = doc.querySelector(".testi-grid")?.closest("section");
  if (testiSec) {
    state.testiEyebrow = testiSec.querySelector(".eyebrow")?.textContent?.trim() || state.testiEyebrow;
    state.testiTitle = testiSec.querySelector("h2")?.textContent?.trim() || state.testiTitle;
    const testiItems = Array.from(testiSec.querySelectorAll(".testi-photo, .testi-card"));
    if (testiItems.length > 0) {
      state.testimonials = testiItems.map(item => {
        if (item.classList.contains("testi-photo")) {
          return {
            type: "image",
            src: item.querySelector("img")?.getAttribute("src") || "",
            caption: item.querySelector(".cap")?.textContent?.trim() || ""
          };
        } else {
          return {
            type: "card",
            text: item.querySelector("p")?.textContent?.trim() || "",
            by: item.querySelector(".by")?.textContent?.trim() || ""
          };
        }
      });
    }
  }

  // 7. Who
  const whoSec = doc.querySelector(".who-list")?.closest("section");
  if (whoSec) {
    state.whoEyebrow = whoSec.querySelector(".eyebrow")?.textContent?.trim() || state.whoEyebrow;
    state.whoTitle = whoSec.querySelector("h2")?.textContent?.trim() || state.whoTitle;
    state.whoLede = whoSec.querySelector(".lede")?.textContent?.trim() || state.whoLede;
    const items = Array.from(whoSec.querySelectorAll(".who-item p"));
    if (items.length > 0) {
      state.whoItems = items.map(p => p.textContent?.trim() || "");
    }
  }

  // 8. Process
  const procSec = doc.querySelector(".process")?.closest("section");
  if (procSec) {
    state.processEyebrow = procSec.querySelector(".eyebrow")?.textContent?.trim() || state.processEyebrow;
    state.processTitle = procSec.querySelector("h2")?.textContent?.trim() || state.processTitle;
    const steps = Array.from(procSec.querySelectorAll(".step"));
    if (steps.length > 0) {
      state.steps = steps.map(s => ({
        num: s.querySelector(".num")?.textContent?.trim() || "",
        title: s.querySelector("h3")?.textContent?.trim() || "",
        desc: s.querySelector("p")?.textContent?.trim() || ""
      }));
    }
  }

  // 9. About
  const aboutSec = doc.querySelector(".about-grid")?.closest("section");
  if (aboutSec) {
    state.aboutEyebrow = aboutSec.querySelector(".eyebrow")?.textContent?.trim() || state.aboutEyebrow;
    state.aboutTitle = aboutSec.querySelector("h2")?.textContent?.trim() || state.aboutTitle;
    state.aboutBadge = aboutSec.querySelector(".about-badge")?.textContent?.trim() || state.aboutBadge;
    state.aboutName = aboutSec.querySelector(".about-name")?.textContent?.trim() || state.aboutName;
    state.aboutRole = aboutSec.querySelector(".about-role")?.textContent?.trim() || state.aboutRole;
    state.aboutBio = aboutSec.querySelector(".about-bio")?.textContent?.trim() || state.aboutBio;
    state.aboutMeta = aboutSec.querySelector(".about-meta")?.textContent?.trim() || state.aboutMeta;
  }

  // 10. Quote
  const quoteSec = doc.querySelector(".quote-section");
  if (quoteSec) {
    state.quoteText = quoteSec.querySelector("blockquote")?.textContent?.trim() || state.quoteText;
    state.quoteBy = quoteSec.querySelector(".quote-by")?.textContent?.trim() || state.quoteBy;
  }

  // 11. FAQ
  const faqSec = doc.querySelector(".faq-item")?.closest("section");
  if (faqSec) {
    state.faqEyebrow = faqSec.querySelector(".eyebrow")?.textContent?.trim() || state.faqEyebrow;
    state.faqTitle = faqSec.querySelector("h2")?.textContent?.trim() || state.faqTitle;
    const faqs = Array.from(faqSec.querySelectorAll(".faq-item"));
    if (faqs.length > 0) {
      state.faqs = faqs.map(f => {
        let q = f.querySelector(".faq-q")?.textContent?.trim() || "";
        if (q.endsWith("+")) q = q.slice(0, -1).trim();
        return {
          q: q,
          a: f.querySelector(".faq-a")?.textContent?.trim() || ""
        };
      });
    }
  }

  // 12. Final
  const finalSec = doc.querySelector(".final");
  if (finalSec) {
    state.final.eyebrow = finalSec.querySelector(".eyebrow")?.textContent?.trim() || state.final.eyebrow;
    state.final.heading = finalSec.querySelector("h2")?.textContent?.trim() || state.final.heading;
    state.final.sub = finalSec.querySelector(".body-text")?.textContent?.trim() || state.final.sub;
    state.final.lineName = finalSec.querySelector(".line-name")?.textContent?.trim() || state.final.lineName;
    state.final.lineId = finalSec.querySelector(".line-id")?.textContent?.trim() || state.final.lineId;
    state.final.lineUrl = finalSec.querySelector(".line-card .cta-btn")?.getAttribute("href") || state.final.lineUrl;
    state.final.qrSrc = finalSec.querySelector(".qr-wrap img")?.getAttribute("src") || state.final.qrSrc;
    state.final.instagramUrl = doc.querySelector(".foot-links a[href*='instagram.com']")?.getAttribute("href") || state.final.instagramUrl;
  }

  // Footer / Footnote
  const footer = doc.querySelector(".stage footer");
  if (footer) {
    const footLinks = footer.querySelector(".foot-links");
    let footnoteText = footer.textContent;
    if (footLinks) {
      footnoteText = footnoteText.replace(footLinks.textContent, "");
    }
    state.final.footNote = footnoteText.trim() || state.final.footNote;
  }
}

/* ================= INIT ================= */
async function initEditor() {
  try {
    const res = await fetch("./index.html?t=" + Date.now());
    if (res.ok) {
      const htmlText = await res.text();
      if (htmlText) {
        parseStateFromHTML(htmlText);
      }
    }
  } catch (e) {
    console.log("無法自動讀取首頁內容，使用預設範本進行編輯", e);
  }
  buildForm();
  renderPreview();
}
initEditor();
